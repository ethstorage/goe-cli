name: goe-wallet-ci

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  wallet-create:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build

      - name: Run Wallet Create CI Test
        run: node test/createWalletCI.mjs
